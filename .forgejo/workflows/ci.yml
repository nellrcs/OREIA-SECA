name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: rust
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
