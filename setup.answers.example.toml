# ─────────────────────────────────────────────────────────────────────────────
# Respostas para a instalação SEM PERGUNTAS — script, CI ou um agente de IA
# com acesso ao shell. Copie para setup.answers.toml, preencha e rode:
#
#   ./oreia install --answers setup.answers.toml     instala tudo do zero
#   ./oreia setup-answers                            só grava a configuração
#
# Campos em branco não mudam o que já está no .env. Nenhuma seção é obrigatória
# — sem [llm], por exemplo, o setup só grava o que você preencheu em
# [telegram]/[forgejo] e avisa que o LLM não foi tocado. Veja docs/instalacao.md
# para a explicação completa de cada campo e como um agente de IA pode usar isto.
# ─────────────────────────────────────────────────────────────────────────────

[telegram]
token = ""              # crie com o @BotFather; em branco desativa o Telegram
allowed = ""             # seu ID numérico (ou vários, separados por vírgula)

[llm]
url = ""                 # ex.: "http://<ip>:11434/v1" (Ollama), "https://openrouter.ai/api/v1"
model = ""               # modelo para planner/dev-*/executor (ex.: "qwen2.5-coder:14b")
chat_model = ""          # modelo para a conversa direta; em branco usa o mesmo de "model"
api_key = ""             # só se o servidor exigir (OpenRouter, etc.); em branco = sem autenticação

[forgejo]
owner_user = ""          # seu usuário (dono/revisor) no Forgejo; em branco = "dono". Só dá para
                         # escolher ANTES da primeira instalação
repos = ""               # repositórios dono/repo, separados por vírgula (ex.: "acme/loja");
                         # em branco = o do exemplo, "minha-org/meu-sistema"
bootstrap = false        # deixe false com "./oreia install" (ele mesmo roda o bootstrap). true só
                         # faz sentido chamando o binário direto: roda scripts/bootstrap.sh

[ports]
# Só se as portas padrão já estiverem em uso nesta máquina. Em branco não muda.
# forgejo_http = 3000    # site do Forgejo
# forgejo_ssh = 2222     # git por SSH
# api = 3120             # API do orquestrador
# px0 = 7777             # revisão de PRs

[mcp]
# enabled = true         # liga/desliga o bloco [mcp] no oreia-seca.toml; em branco não muda
# http = false            # transporte HTTP opcional, além do stdio; true gera MCP_TOKEN sozinho

[px0]
allowed_users = ""       # contas do Forgejo que podem entrar no px0, separadas por vírgula
