[workspace]
resolver = "2"
members = [
    "crates/oreia-core",
    "crates/oreia-llm",
    "crates/oreia-forgejo",
    "crates/oreia-channels",
    "crates/oreia-seca",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
oreia-core = { path = "crates/oreia-core" }
oreia-llm = { path = "crates/oreia-llm" }
oreia-forgejo = { path = "crates/oreia-forgejo" }
oreia-channels = { path = "crates/oreia-channels" }

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = "0.8"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
regex = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
